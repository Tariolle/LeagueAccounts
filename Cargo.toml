[workspace]
members = ["src-tauri"]

[package]
name = "leagueaccounts"
version = "3.0.1"
edition = "2021"
description = "League of Legends account manager for Windows"
license = "MIT"

[dependencies]
arboard = "3.6"
html-escape = "0.2"
keyring = { version = "3.6", features = ["windows-native"] }
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
scraper = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.23"
