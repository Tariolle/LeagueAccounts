name: Build (Windows)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Node from mise.toml; Rust comes from rustup below.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node
      - uses: actions/cache@v5
        with:
          path: ~/AppData/Local/npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install stable Rust and Clippy
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Install frontend dependencies
        run: npm ci
      # The Tauri shell embeds ../dist at compile time, so build the UI first.
      - name: Type-check and build the UI
        run: npm run build
      - name: Renderer authentication regressions
        run: npm test
      - name: Account interface and motion regressions
        run: npm run test:ui
      - name: Unit and regression tests
        run: cargo +stable test --locked --workspace --all-targets
      - name: Clippy
        run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings
      - name: Release build
        run: npx tauri build --no-bundle
